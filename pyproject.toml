[project]
name = "sermon-scraper"
version = "0.1.0"
description = "Tooling to download and organize audio files of sermons for CCTheRock from various sources."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mutagen>=1.48.1",
    "plac>=1.4.5",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "tqdm>=4.69.0",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "types-tqdm>=4.69.0.20260724",
]
